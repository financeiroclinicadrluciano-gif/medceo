# Aponta medceo.online para o worker do MedCEO.
#
# Roda a mao (workflow_dispatch), nao em push: e mudanca de DNS, nao de codigo.
# Existe como workflow, e nao como clique no painel, porque o token da
# Cloudflare mora nos secrets deste repositorio e nao na maquina de ninguem.
#
# Contexto: em 10/08 o dominio saiu da HostGator e entrou na Cloudflare
# continuando a apontar para o Lovable. O Lovable passou a responder 421 para
# requisicao vinda por proxy de terceiro, e o site caiu. Apontar para o worker
# conserta e ao mesmo tempo coloca o deploy automatico no dominio real.
#
# Usa jq, nao python inline: a primeira versao deste arquivo quebrou o YAML por
# aninhamento de aspas dentro de f-string, e o GitHub nem registrou o gatilho.

name: Apontar dominio

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: Dominio a apontar para o worker
        required: true
        default: medceo.online

jobs:
  apontar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HOSTNAME: ${{ inputs.hostname }}
      WORKER: financeiroclinicadrluciano-gif-medceo
      API: https://api.cloudflare.com/client/v4
    steps:
      - name: Achar a zona
        run: |
          set -uo pipefail
          ZONA=$(echo "$HOSTNAME" | rev | cut -d. -f1-2 | rev)
          echo "hostname: $HOSTNAME | zona: $ZONA"

          ZONE_ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API/zones?name=$ZONA" | jq -r '.result[0].id // empty')

          if [ -z "$ZONE_ID" ]; then
            echo "::error::Zona $ZONA nao encontrada nesta conta."
            curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/zones" \
              | jq -r '.result[] | "  \(.name)  \(.status)"'
            exit 1
          fi
          echo "ZONE_ID=$ZONE_ID" >> "$GITHUB_ENV"
          echo "zona encontrada"

      - name: Registrar a zona antes de mexer
        run: |
          set -uo pipefail
          echo "Estes sao os valores de rollback. Se algo der errado, recriar daqui."
          RESP=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API/zones/$ZONE_ID/dns_records?per_page=200")

          # Imprime a resposta crua quando falha. Sem isso o erro chega como
          # "Cannot iterate over null" do jq, que esconde o motivo real —
          # foi assim que uma falta de permissao passou por erro de sintaxe.
          if ! echo "$RESP" | jq -e '.success' > /dev/null 2>&1; then
            echo "::error::A API recusou a leitura do DNS. Resposta crua abaixo."
            echo "$RESP" | jq . || echo "$RESP"
            exit 1
          fi
          echo "$RESP" | jq -r '.result[] | "  \(.type)\t\(.name)\t\(.content)\tproxied=\(.proxied)"'

      - name: Apagar A, AAAA e CNAME do apex
        run: |
          set -uo pipefail
          # So o proprio hostname, e so estes tres tipos. MX, TXT, SPF, DKIM e
          # subdominios ficam intactos: apagar MX aqui derrubaria o e-mail do
          # dominio junto com o site.
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API/zones/$ZONE_ID/dns_records?per_page=200" \
            | jq -r --arg alvo "$HOSTNAME" \
              '.result[] | select(.name == $alvo) | select(.type == "A" or .type == "AAAA" or .type == "CNAME") | "\(.id) \(.type) \(.content)"' \
            > /tmp/apagar.txt

          if [ ! -s /tmp/apagar.txt ]; then
            echo "nenhum registro a apagar"
            exit 0
          fi
          cat /tmp/apagar.txt

          while read -r ID TIPO CONTEUDO; do
            [ -z "${ID:-}" ] && continue
            echo "apagando $TIPO $CONTEUDO"
            curl -s -X DELETE "$API/zones/$ZONE_ID/dns_records/$ID" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.success'
          done < /tmp/apagar.txt

      - name: Anexar o dominio ao worker
        run: |
          set -uo pipefail
          RESP=$(curl -s -X PUT "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"environment\":\"production\",\"hostname\":\"$HOSTNAME\",\"service\":\"$WORKER\",\"zone_id\":\"$ZONE_ID\"}")
          echo "$RESP" | jq .
          echo "$RESP" | jq -e '.success' > /dev/null

      - name: Verificar o dominio no ar
        run: |
          set -uo pipefail
          echo "aguardando propagacao e certificado"
          sleep 60
          FALHAS=0
          for ROTA in / /metodo /blog /sitemap.xml; do
            CODE=$(curl -s -m 30 -o /dev/null -w '%{http_code}' "https://$HOSTNAME$ROTA")
            echo "$CODE $ROTA"
            [ "$CODE" = "200" ] || FALHAS=$((FALHAS+1))
          done

          PUBLICADOS=$(curl -s -m 30 --compressed "https://$HOSTNAME/blog" \
            | grep -aoE 'href="/blog/[a-z0-9-]+"' | sort -u | wc -l | tr -d ' ')
          echo "posts listados no /blog: $PUBLICADOS"
          [ "$PUBLICADOS" -gt 0 ] || FALHAS=$((FALHAS+1))

          if [ "$FALHAS" -gt 0 ]; then
            echo "::error::Dominio anexado, mas ainda nao responde. Certificado pode levar ate 15 min."
            exit 1
          fi
          echo "Dominio verificado no ar."
