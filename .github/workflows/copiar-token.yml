# Copia o CLOUDFLARE_API_TOKEN deste repo para o vision-build-stream.
#
# Por que existe: em 10/09/2026 o token do vision-build-stream passou a
# devolver 401 Invalid API Token as 19:12, enquanto o deste repo, salvo as
# 18:46, continuou valido (verify devolveu 200). Os dois deploys usam a mesma
# conta da Cloudflare, entao o token bom serve para os dois.
#
# O valor nunca e impresso: sai do secret daqui, e cifrado com a chave publica
# do repo de destino e vai direto para a API do GitHub.
#
# Workflow de uso unico. Apagar depois de rodar.
name: Copiar token para o vision-build-stream

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar libsodium
        run: pip install --quiet pynacl

      - name: Cifrar e gravar no repo de destino
        env:
          VALOR: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT_TEMP }}
          DESTINO: financeiroclinicadrluciano-gif/vision-build-stream
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from base64 import b64encode
          from nacl import encoding, public

          destino = os.environ["DESTINO"]
          pat = os.environ["GH_PAT"]
          valor = os.environ["VALOR"]
          if not valor:
              raise SystemExit("secret de origem vazio")

          def api(caminho, dados=None, metodo=None):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{destino}/{caminho}",
                  data=json.dumps(dados).encode() if dados else None,
                  headers={"Authorization": f"Bearer {pat}",
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json"},
                  method=metodo)
              with urllib.request.urlopen(req, timeout=30) as r:
                  corpo = r.read()
                  return r.status, (json.loads(corpo) if corpo else {})

          _, chave = api("actions/secrets/public-key")
          cifrado = public.SealedBox(
              public.PublicKey(chave["key"].encode(), encoding.Base64Encoder())
          ).encrypt(valor.encode())

          st, _ = api("actions/secrets/CLOUDFLARE_API_TOKEN",
                      {"encrypted_value": b64encode(cifrado).decode(),
                       "key_id": chave["key_id"]}, "PUT")
          print("gravado, http =", st)
          print("tamanho do valor copiado:", len(valor), "caracteres")
          PY
