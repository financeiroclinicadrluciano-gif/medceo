# Deploy automatico do site do MedCEO.
#
# O projeto builda com TanStack Start + Nitro no preset Cloudflare, gerando
# .output/server (worker SSR) e .output/public (assets). O worker se chama
# financeiroclinicadrluciano-gif-medceo, conforme .output/server/wrangler.json.
#
# Por que existe: o Lovable so publica no clique manual. Com este workflow, todo
# push na main vai ao ar sozinho, incluindo os posts que entram pela publicacao
# escalonada por data.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # O wrangler-action com bun nao repassou a credencial (erro 9106 mesmo
      # com token valido, que publicou o outro site minutos antes). Chamando o
      # wrangler direto, com as variaveis no ambiente do processo, que e como
      # ele espera receber.
      - name: Publicar no Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3.90.0 deploy --config .output/server/wrangler.json

      # Deploy verde nao prova site no ar. Em 10/08 o worker publicou com
      # sucesso tres vezes seguidas servindo 500 no site inteiro, e depois
      # servindo o blog com zero posts. Este passo e o criterio objetivo de
      # pronto: se o site nao responde de verdade, o run fica vermelho.
      - name: Verificar o site no ar
        run: |
          BASE=https://financeiroclinicadrluciano-gif-medceo.financeiroclinicadrluciano.workers.dev
          sleep 20
          FALHAS=0
          for ROTA in / /metodo /mentoria /blog /sobre /faq /contato /sitemap.xml; do
            CODE=$(curl -s -m 30 -o /dev/null -w '%{http_code}' "$BASE$ROTA")
            echo "$CODE $ROTA"
            [ "$CODE" = "200" ] || FALHAS=$((FALHAS+1))
          done

          # O blog precisa listar post de verdade. Zero post com markdown no
          # repositorio foi exatamente o sintoma do relogio do Workers.
          PUBLICADOS=$(curl -s -m 30 --compressed "$BASE/blog" \
            | grep -aoE 'href="/blog/[a-z0-9-]+"' | sort -u | wc -l | tr -d ' ')
          echo "posts listados no /blog: $PUBLICADOS"
          [ "$PUBLICADOS" -gt 0 ] || FALHAS=$((FALHAS+1))

          if [ "$FALHAS" -gt 0 ]; then
            echo "::error::Deploy publicou, mas o site nao respondeu como esperado ($FALHAS falhas)."
            exit 1
          fi
          echo "Site verificado no ar."
