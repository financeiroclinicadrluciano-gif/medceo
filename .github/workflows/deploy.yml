# Deploy automatico do site do MedCEO.
#
# O projeto builda com TanStack Start + Nitro no preset Cloudflare, gerando
# .output/server (worker SSR) e .output/public (assets). O worker se chama
# financeiroclinicadrluciano-gif-medceo, conforme .output/server/wrangler.json.
#
# Por que existe: o Lovable so publica no clique manual. Com este workflow, todo
# push na main vai ao ar sozinho, incluindo os posts que entram pela publicacao
# escalonada por data.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Temporario: o site publicou mostrando "0 textos publicados" enquanto o
      # repositorio tem 10 markdowns e 4 ja na data. Isto mostra o que o build
      # de fato enxergou, em vez de supor.
      - name: Diagnostico temporario, o que o build enxergou
        continue-on-error: true
        run: |
          echo "data do runner: $(date -u +%F)"
          echo "markdowns no repo: $(ls src/content/blog/*.md | wc -l)"
          echo "--- slugs dentro do bundle SSR ---"
          grep -rhoE "(margem-lucro-clinica-medica|valuation-clinica-saida-socio)" .output/server | sort | uniq -c
          echo "--- chunk de posts gerado ---"
          ls .output/server/_ssr/ | grep -i posts || echo "nenhum chunk posts"

      # O wrangler-action com bun nao repassou a credencial (erro 9106 mesmo
      # com token valido, que publicou o outro site minutos antes). Chamando o
      # wrangler direto, com as variaveis no ambiente do processo, que e como
      # ele espera receber.
      - name: Publicar no Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3.90.0 deploy --config .output/server/wrangler.json

      # Temporario: o worker publica, mas responde 500 com a pagina de erro do
      # src/server.ts, que faz console.error do erro real. O tail e o unico jeito
      # de ler esse erro, porque ele nunca chega ao navegador.
      - name: Diagnostico temporario, ler o erro real do SSR
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3.90.0 tail financeiroclinicadrluciano-gif-medceo \
            --format json > /tmp/tail.log 2>&1 &
          TAIL_PID=$!
          sleep 15
          echo "--- batendo no worker ---"
          curl -s -o /dev/null -w "home: %{http_code}\n" \
            https://financeiroclinicadrluciano-gif-medceo.financeiroclinicadrluciano.workers.dev/
          curl -s -o /dev/null -w "blog: %{http_code}\n" \
            https://financeiroclinicadrluciano-gif-medceo.financeiroclinicadrluciano.workers.dev/blog
          sleep 15
          kill $TAIL_PID 2>/dev/null || true
          echo "--- log do worker ---"
          cat /tmp/tail.log
