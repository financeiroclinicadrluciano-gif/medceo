# Deploy automatico do site do MedCEO.
#
# O projeto builda com TanStack Start + Nitro no preset Cloudflare, gerando
# .output/server (worker SSR) e .output/public (assets). O worker se chama
# financeiroclinicadrluciano-gif-medceo, conforme .output/server/wrangler.json.
#
# Por que existe: o Lovable so publica no clique manual. Com este workflow, todo
# push na main vai ao ar sozinho, incluindo os posts que entram pela publicacao
# escalonada por data.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Diagnostico temporario do token Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "--- token verify ---"
          curl -s -X GET "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | tee /tmp/verify.json
          echo ""
          echo "--- account lookup ---"
          curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | tee /tmp/account.json
          echo ""
          echo "--- workers scripts list ---"
          curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | tee /tmp/scripts.json
          echo ""
          echo "--- workers services (endpoint que falha) ---"
          curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/financeiroclinicadrluciano-gif-medceo" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | tee /tmp/services.json

      # O wrangler-action com bun nao repassou a credencial (erro 9106 mesmo
      # com token valido, que publicou o outro site minutos antes). Chamando o
      # wrangler direto, com as variaveis no ambiente do processo, que e como
      # ele espera receber.
      - name: Publicar no Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3.90.0 deploy --config .output/server/wrangler.json
