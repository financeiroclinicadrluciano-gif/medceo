# Deploy do site MedCEO.
#
# O site e estatico: HTML/CSS/JS em `site/`, servidos pelo binding ASSETS do
# Cloudflare Workers. Nao ha build step — o que esta no repositorio e exatamente
# o que vai ao ar, o que torna qualquer regressao rastreavel por diff.
#
# O blog e gerado a partir dos markdown em `conteudo/blog/` pelo
# `scripts/gerar_blog.py`, que respeita a publicacao escalonada por data.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Post agendado precisa entrar no ar no dia marcado, sem push.
  schedule:
    - cron: "0 9 * * *"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regerar o blog (respeita a data de publicacao)
        run: python3 scripts/gerar_blog.py

      - name: Publicar no Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.42.0 deploy --config wrangler.json

      # Deploy verde nao prova site no ar. Em 10/08 o worker publicou com
      # sucesso tres vezes seguidas servindo 500. Este passo e o criterio
      # objetivo de pronto: se o site nao responde, o run fica vermelho.
      - name: Verificar o site no ar
        run: |
          BASE=https://medceo.online
          sleep 20
          FALHAS=0
          for ROTA in / /diagnostico /webnar /blog /sitemap.xml; do
            CODE=$(curl -s -m 30 -o /dev/null -w '%{http_code}' -L "$BASE$ROTA")
            echo "$CODE $ROTA"
            [ "$CODE" = "200" ] || FALHAS=$((FALHAS+1))
          done

          # O blog precisa listar post de verdade — zero post com markdown no
          # repositorio foi exatamente o sintoma do bug do relogio do Workers.
          PUBLICADOS=$(curl -s -m 30 --compressed "$BASE/blog" \
            | grep -aoE 'href="/blog/[a-z0-9-]+"' | sort -u | wc -l | tr -d ' ')
          echo "posts listados no /blog: $PUBLICADOS"
          [ "$PUBLICADOS" -ge 1 ] || FALHAS=$((FALHAS+1))

          # O numero do case precisa bater com a transcricao do depoimento.
          if curl -s -m 30 --compressed "$BASE/" | grep -q "200 mil"; then
            echo "ERRO: numero sem fonte (R\$ 200 mil) voltou ao ar"
            FALHAS=$((FALHAS+1))
          fi

          [ "$FALHAS" -eq 0 ] || { echo "FALHAS: $FALHAS"; exit 1; }
          echo "site no ar, verificado"
